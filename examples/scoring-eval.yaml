    category: 语言挑战
    intent: 英文三年经验硬要求也应排除零年候选人
    job: {description: 'Minimum 3 years of full-time experience required. SQL and user research.'}
    expected: {filtered: true, reasons_contains: 正式工作年限}
  - id: E10
    category: 语言挑战
    intent: 不要求博士不应被当作要求博士
    job: {description: '应届可投，不要求博士学历及以上，负责用户研究。'}
