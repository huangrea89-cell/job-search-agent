    category: 常规边界
    intent: 多城市包含杭州时保留
    job: {locations: [北京, 杭州]}
    expected: {filtered: false}
  - id: E06
    category: 常规边界
    intent: 实习岗位按全职偏好排除
    job: {employment_type: internship}
    expected: {filtered: true, reasons_contains: 非全职}
  - id: E07
    category: 常规边界
    intent: 缺地点时提示而非直接排除
    job: {locations: []}
    expected: {filtered: false, needs_contains: 工作地点}
  - id: E08
    category: 常规边界
    intent: 无证据不得获得履历分
    candidate: {education: [], skills: [], full_time_years: 0}
    job: {}
    expected: {resume_score_max: 0}
