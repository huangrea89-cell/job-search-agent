name: Core tests and scoring evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run core tests
        run: python -m pytest --junitxml=data/ci/junit.xml
      - name: Evaluate scoring expectations
        if: ${{ !cancelled() }}
        run: python -m app.evaluation --output data/ci/evaluation --strict
      - name: Smoke test offline demo
        if: ${{ !cancelled() }}
        run: job-agent demo --output data/ci/demo-runs
      - name: Retain test and evaluation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-reports-${{ matrix.os }}
          path: |
            data/ci/junit.xml
            data/ci/evaluation/results.json
            data/ci/evaluation/results.md
          retention-days: 7
          if-no-files-found: warn
